server:
  port: 8081

spring:
  application:
    name: storage-service

  datasource:
    url: jdbc:postgresql://localhost:5434/storage_db
    username: storage
    password: storage

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/car-dealership

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: storage-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      properties:
        spring.json.add.type.headers: false
