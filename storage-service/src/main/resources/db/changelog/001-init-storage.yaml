databaseChangeLog:
  - changeSet:
      id: 001-create-assembly-orders
      author: 322moon
      changes:
        - createTable:
            tableName: assembly_orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_order_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source_order_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: car_id
                  type: UUID
              - column:
                  name: model_id
                  type: UUID
              - column:
                  name: warehouse_employee_id
                  type: UUID
              - column:
                  name: trace_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: fail_reason
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: BOOLEAN
                  constraints:
                    nullable: false
        - createIndex:
            tableName: assembly_orders
            indexName: idx_assembly_orders_source_order_id
            columns:
              - column:
                  name: source_order_id
